[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipipelineco"
version = "0.1.0"
description = "Reliability-first ingestion framework: sources to warehouse to dbt to run report. Runs free on DuckDB, ships a real Snowflake adapter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Micole Kurt Gonda" }]
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "dbt-core>=1.9,<2",
  "dbt-duckdb>=1.9,<2",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
postgres = ["psycopg[binary]>=3.1", "dbt-postgres>=1.9,<2"]
snowflake = ["snowflake-connector-python>=3.7", "dbt-snowflake>=1.8"]
airflow = ["apache-airflow>=2.9,<3"]
dev = ["pytest>=8", "ruff>=0.5", "pyspark>=3.5", "psycopg[binary]>=3.1"]

[project.scripts]
ipipelineco = "ipipelineco.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipipelineco = ["default.yml", "templates/*.j2", "dbt_project/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905", "B008"]
