pipelineco:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('PIPELINECO_DB') }}"
      threads: 1
    # Needs `pip install 'pipelineco[snowflake]'` and the SNOWFLAKE_* variables.
    # Not exercised in this repo's CI: run it against your own account.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: staging
      threads: 4
