<text x="58" y="276" font-size="12" fill="#646b7e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">Python · PySpark · Snowflake · Postgres/Supabase · dbt · Airflow</text>
<text x="58" y="300" font-size="12" fill="#646b7e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">$ ipipelineco demo   <tspan fill="#4ade80">free, offline, 20 seconds</tspan></text>
