<text x="58" y="158" font-size="22" font-weight="600" fill="#eceef4">Pipelines that survive a bad Tuesday.</text>
<text x="58" y="190" font-size="14" fill="#9097aa">Ingest to warehouse to dbt to one report.</text>
<text x="58" y="210" font-size="14" fill="#9097aa">Idempotent, retried, observable.</text>
