<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" role="img" aria-label="ipipelineco: pipelines that survive a bad Tuesday. Sources flow through ingest into the warehouse." font-family="Inter,ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#505872" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
