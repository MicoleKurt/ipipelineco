name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests dags
      - run: pytest            # includes the PySpark engine parity test (Java 17 present)
      - run: pipelineco demo

  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install "apache-airflow==2.10.5" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install duckdb pyarrow pyyaml typer rich jinja2 dbt-duckdb pytest
      - run: pytest tests/test_dag.py -v
