# Airflow running the ipipelineco DAG. Not exercised in the repo's CI: it is a starting point.
#   docker compose up        then open http://localhost:8080  (user: admin, password printed in the logs)
services:
  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    ports: ["8080:8080"]
    environment:
      IPIPELINECO_WORKDIR: /opt/airflow/ipipelineco
      IPIPELINECO_WEBHOOK_URL: ""
      _PIP_ADDITIONAL_REQUIREMENTS: "ipipelineco @ file:///opt/airflow/src"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/src
      - ipipelineco-data:/opt/airflow/ipipelineco
volumes:
  ipipelineco-data:
